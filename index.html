<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Games - Integração Pronta</title>
    
    <!-- ==================================================================== -->
    <!-- [BLOCO 1] DEPENDÊNCIAS (Coloque isso no <head> do seu site)          -->
    <!-- ==================================================================== -->
    
    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Tipografia Gamer) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ==================================================================== */
        /* [BLOCO 2] CSS DO WIDGET (Copie para seu arquivo .css ou <style>)     */
        /* ==================================================================== */
        
        /* Variáveis de Cores (Escopo Global do Chat) */
        :root {
            --atomic-primary: #FFC107;
            --atomic-bg-dark: #121212;
            --atomic-bg-glass: rgba(18, 18, 18, 0.95);
            --atomic-text-light: #ffffff;
            --atomic-text-dark: #0a0a0a;
            --atomic-border: rgba(255, 193, 7, 0.3);
            --atomic-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        /* 1. Botão Flutuante (Bolha) */
        .atomic-chat-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--atomic-primary);
            background-color: var(--atomic-bg-dark);
            background-image: url('https://raw.githubusercontent.com/atomicgamesbrasil/chatbot/main/img/thchatbot.jpg');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            z-index: 99999; /* Z-Index altíssimo para ficar sobre tudo */
        }
        .atomic-chat-toggle:hover {
            transform: scale(1.1) rotate(-5deg);
            box-shadow: 0 0 30px rgba(255, 193, 7, 0.6);
        }
        .atomic-notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 22px;
            height: 22px;
            background: #f44336;
            color: white;
            font-size: 11px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--atomic-bg-dark);
            animation: atomic-bounce 2s infinite;
            font-family: sans-serif;
        }
        /* 2. Janela Principal do Chat */
        .atomic-chat-widget {
            /* Reset de CSS interno para não herdar estilos do seu site */
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            line-height: 1.5;
            
            position: fixed;
            bottom: 110px;
            right: 25px;
            width: 380px;
            height: 600px;
            max-height: 80vh;
            background: var(--atomic-bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--atomic-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
            box-shadow: var(--atomic-shadow);
            z-index: 99999;
            overflow: hidden;
        }
        .atomic-chat-widget * {
            box-sizing: border-box; /* Garante que padding não quebre layout */
        }
        .atomic-chat-widget.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        /* Header */
        .atomic-chat-header {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.15), transparent);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        .atomic-header-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--atomic-primary);
            background-image: url('https://raw.githubusercontent.com/atomicgamesbrasil/chatbot/main/img/thchatbot.jpg');
            background-size: cover;
            background-position: center;
        }
        .atomic-header-info h3 {
            color: var(--atomic-primary);
            margin: 0;
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }
        .atomic-header-info span {
            color: #888;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .atomic-status-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            display: inline-block;
        }
        
        .atomic-status-dot.typing {
            background: var(--atomic-primary);
            animation: atomic-blink 0.5s infinite alternate;
        }
        .atomic-close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
        }
        
        .atomic-close-btn:hover { color: var(--atomic-primary); }
        /* Corpo (Mensagens) */
        .atomic-chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--atomic-primary) transparent;
        }
        /* Balões de Mensagem */
        .atomic-msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            position: relative;
            word-wrap: break-word;
            opacity: 0;
            transform: translateY(10px);
            animation: atomic-popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: white; /* Default text color */
        }
        .atomic-msg.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: var(--atomic-text-light);
            border-bottom-left-radius: 2px;
        }
        .atomic-msg.user {
            align-self: flex-end;
            background: var(--atomic-primary);
            color: var(--atomic-text-dark);
            border-bottom-right-radius: 2px;
            font-weight: 600;
        }
        /* Footer (Input) */
        .atomic-chat-footer {
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .atomic-chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 10px 15px;
            color: white;
            outline: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
        }
        .atomic-chat-input:focus { border-color: var(--atomic-primary); }
        .atomic-send-btn {
            background: var(--atomic-primary);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--atomic-text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .atomic-send-btn:hover { transform: scale(1.05); }
        /* Card Produto */
        .atomic-product-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            margin-top: 5px;
            cursor: pointer;
            transition: border-color 0.3s;
            animation: atomic-popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }
        
        .atomic-product-card:hover { border-color: var(--atomic-primary); }
        .atomic-product-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 5px;
            display: block;
        }
        .ap-name { color: var(--atomic-primary); font-weight: bold; font-size: 14px; margin-bottom: 2px;}
        .ap-price { color: white; font-weight: bold; font-size: 16px; margin: 2px 0; }
        .ap-desc { color: #999; font-size: 12px; }
        /* Loading Screen Interno */
        .atomic-loader {
            position: absolute;
            inset: 0;
            background: var(--atomic-bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .atomic-loader-spin {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: var(--atomic-primary);
            border-radius: 50%;
            animation: atomic-spin 1s linear infinite;
        }
        
        /* Animações */
        @keyframes atomic-bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        @keyframes atomic-popIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes atomic-spin { to { transform: rotate(360deg); } }
        @keyframes atomic-blink { from { opacity: 1; } to { opacity: 0.4; } }
        
        /* Responsividade Mobile */
        @media (max-width: 480px) {
            .atomic-chat-widget {
                width: calc(100% - 30px);
                height: 75vh;
                right: 15px;
                bottom: 105px;
            }
        }
        
        /* --- ESTILOS APENAS PARA A DEMO (NÃO COPIAR PARA O SITE OFICIAL) --- */
        body { margin: 0; background: #050505; color: #fff; font-family: sans-serif; }
        .demo-site-header { background: #111; padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .demo-logo { font-size: 24px; font-weight: bold; color: #fff; letter-spacing: 2px; }
        .demo-nav { display: flex; gap: 20px; color: #888; }
        .demo-hero { height: 400px; background: linear-gradient(45deg, #1a1a1a, #0a0a0a); display: flex; align-items: center; justify-content: center; color: #333; font-size: 40px; font-weight: bold; text-transform: uppercase; letter-spacing: 5px; opacity: 0.3; }
    </style>
</head>
<body>
    <!-- Conteúdo DEMO (Não faz parte do Bot) -->
    <header class="demo-site-header">
        <div class="demo-logo">ATOMIC STORE</div>
        <nav class="demo-nav">
            <span>Hardware</span>
            <span>Periféricos</span>
            <span>Monitores</span>
        </nav>
    </header>
    <div class="demo-hero">SITE DE EXEMPLO</div>
    <!-- ==================================================================== -->
    <!-- [BLOCO 3] HTML DO WIDGET (Copie e cole antes do fechamento do </body>) -->
    <!-- ==================================================================== -->
    <!-- Botão de Abrir -->
    <div class="atomic-chat-toggle" id="atomicChatToggle" title="Falar com Thiago">
        <span class="atomic-notification-badge" id="atomicChatBadge">1</span>
    </div>
    <!-- Container do Chat -->
    <div class="atomic-chat-widget" id="atomicChatWidget">
        <!-- Loader Inicial -->
        <div class="atomic-loader" id="atomicChatLoader">
            <div class="atomic-loader-spin"></div>
            <p style="margin-top: 15px; font-size: 14px; color: #888;">Chamando <b>Thiago</b>...</p>
        </div>
        <!-- Cabeçalho -->
        <div class="atomic-chat-header">
            <div class="atomic-header-avatar"></div>

                <h3>Thiago</h3>
                <span><span class="atomic-status-dot" id="atomicStatusDot"></span> Consultor Gamer</span>
            </div>
            <button class="atomic-close-btn" id="atomicCloseChat"><i class="fas fa-times"></i></button>

        <div class="atomic-chat-body" id="atomicChatBody"></div>

        <div class="atomic-chat-footer">
            <input type="text" class="atomic-chat-input" id="atomicChatInput" placeholder="Pergunte ao Thiago..." disabled>

        </div>
    </div>
    <!-- ==================================================================== -->
    <!-- [BLOCO 4] SCRIPT JS (Copie e cole no final do body, após o HTML)     -->
    <!-- ==================================================================== -->
    <script>
        /**
         * THIAGO CHATBOT - LÓGICA DE INTEGRAÇÃO v6.6 (REVISÃO COMPLETA + CORREÇÃO UX MOBILE)
         * * Melhorias nesta versão:
         * 1. CORREÇÃO DE BUG: Clique na bolha fecha o chat (UX Mobile).
         * 2. CORREÇÃO DE FLUIDEZ: Input limpa a caixa de texto SOMENTE após a resposta ser enviada (não antes).
         * 3. MELHORIA NLP: Ajustes finos no safetyCheck para termos parciais e ampliação da inteligência de busca.
         * 4. INTEGRAÇÃO: Confirmação de Adicionar ao Carrinho (Sim/Não) via estado pendingProductId.
         */
        const GITHUB_CATALOG_URL = 'https://raw.githubusercontent.com/atomicgamesbrasil/siteoficial/main/produtos.json';
        const CACHE_KEY = 'atomic_catalog_v1';
        const CACHE_TIME_KEY = 'atomic_catalog_time';
        const CACHE_DURATION = 3600000; // 1 Hora
        
        // Backup de Segurança Expandido
        const BACKUP_CATALOG = [
            { id: 'bak0', nome: "Gabinete Gamer Cooler Master MasterBox TD500", preco: 650.00, categoria: "Gabinete", tags: ["gabinete", "pc", "vidro", "airflow", "gamer"], estoque: 4, descricao: "Excelente fluxo de ar com painel lateral em vidro temperado.", imagem: "https://m.media-amazon.com/images/I/71R2o8F-4SL._AC_SX679_.jpg" },
            { id: 'bak1', nome: "Placa de Vídeo RTX 4060 Ti 8GB", preco: 2899.90, categoria: "GPU", tags: ["gpu", "video", "nvidia"], estoque: 5, descricao: "Placa custo-benefício (Backup)", imagem: "https://m.media-amazon.com/images/I/716173+O3IL._AC_SX679_.jpg" },
            { id: 'bak2', nome: "Processador Ryzen 5 5600", preco: 899.90, categoria: "CPU", tags: ["cpu", "processador"], estoque: 10, descricao: "Processador de entrada (Backup)", imagem: "https://m.media-amazon.com/images/I/61twLgeQk4L._AC_SX679_.jpg" },
            { id: 'bak3', nome: "Controle DualSense PS5 - Branco", preco: 450.00, categoria: "Periféricos", tags: ["controle", "gamepad", "ps5", "periférico"], estoque: 8, descricao: "Controle original Sony PS5 (Backup)", imagem: "https://m.media-amazon.com/images/I/61IG46p-yHL._AC_SX679_.jpg" },
        ];
        
        // Sinônimos e termos que devem ser normalizados
        const SYNONYMS = {
            'play 5': 'playstation 5', 'ps5': 'playstation 5', 'xbox': 'xbox series',
            'vga': 'placa de vídeo', 'gpu': 'placa de vídeo', 'proc': 'processador',
            'cpu': 'processador', 'mobo': 'placa mãe', 'ram': 'memória', 'zap': 'whatsapp',
            'controle': 'gamepad', 'joystick': 'gamepad', 'manete': 'gamepad',
            'gabinete': 'gabinete', 
            'case': 'gabinete',
            'gamer': 'gamer',
            'placa': 'placa',
            'video': 'placa de vídeo', // Adicionado para cobrir "placa de video"
        };

        // Palavras que devem ser ignoradas na busca por produto (noise words)
        const NOISE_WORDS = ['quero', 'comprar', 'preço', 'valor', 'quanto', 'custa', 'tem', 'voce', 'eu', 'um', 'uma', 'o', 'a', 'de', 'do', 'da', 'no', 'na', 'é', 'e', 'pra', 'pro', 'se', 'me', 'indica', 'recomenda', 'ajuda', 'melhor', 'pc', 'alguma', 'especifica', 'tipo', 'ou', 'quer', 'uma', 'ajuda', 'para', 'montar', 'gamer', 'gabinete'];

        let catalogoGlobal = [];
        
        class GitHubIntegrator {
            async fetchCatalog() {
                const cachedData = localStorage.getItem(CACHE_KEY);
                const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
                
                if (cachedData && cacheTime) {
                    const now = new Date().getTime();
                    if (now - parseInt(cacheTime) < CACHE_DURATION) {
                        return JSON.parse(cachedData);
                    }
                }
                try {
                    const response = await fetch(GITHUB_CATALOG_URL);
                    if (!response.ok) throw new Error("Erro HTTP");
                    const data = await response.json();
                    const processed = this.processData(data);
                    
                    localStorage.setItem(CACHE_KEY, JSON.stringify(processed));
                    localStorage.setItem(CACHE_TIME_KEY, new Date().getTime().toString());
                    return processed;
                } catch (e) {
                    console.warn("⚠️ GitHub Offline. Usando backup.", e);
                    // Garante que o catálogo de backup seja processado se não houver cache
                    return cachedData ? [...JSON.parse(cachedData), ...BACKUP_CATALOG.filter(b => !JSON.parse(cachedData).some(g => g.nome === b.nome))] : this.processData(BACKUP_CATALOG);
                }
            }
            
            processData(items) { return items.map(item => this.normalizeItem(item)); }
            
            normalizeItem(item) {
                // Lógica de limpeza de preço mais robusta para formato BR e correção de 79900 -> 799.00
                let price;
                if (typeof item.price === 'string') {
                    let priceString = item.price.replace(/R\$/g, '').trim();
                    priceString = priceString.replace(/\./g, '').replace(',', '.');
                    price = parseFloat(priceString);
                } else {
                    price = Number(item.price);
                }
                
                // HACK DE CORREÇÃO: Trata o caso em que o preço é lido incorretamente (ex: 79900 -> 799.00)
                if (price > 10000 && item.category !== 'GPU' && item.category !== 'CPU' && item.category !== 'Console') {
                    price = parseFloat((price / 100).toFixed(2));
                }
                
                price = isNaN(price) ? 0 : price;

                // Mapeamento de categorias e tags
                const name = item.name.toLowerCase();
                let cat = item.category || 'Hardware';
                let tags = ['github'];

                if (name.includes('rtx') || name.includes('rx') || name.includes('gtx') || cat.toLowerCase() === 'gpu') { cat = 'GPU'; tags.push('placa de vídeo', 'gpu', 'video'); }
                else if (name.includes('ryzen') || name.includes('intel') || name.includes('core') || cat.toLowerCase() === 'cpu') { cat = 'CPU'; tags.push('processador', 'cpu'); }
                else if (name.includes('ssd') || name.includes('nvme')) { cat = 'Armazenamento'; tags.push('ssd', 'hd'); }
                else if (name.includes('memória') || name.includes('ram')) { cat = 'Memória'; tags.push('memória', 'ram'); }
                else if (name.includes('fonte') || cat.toLowerCase() === 'fonte') { cat = 'Fonte'; tags.push('fonte', 'psu'); }
                else if (name.includes('monitor') || cat.toLowerCase() === 'monitor') { cat = 'Monitor'; tags.push('monitor', 'tela'); }
                else if (name.includes('teclado') || name.includes('mouse') || name.includes('headset') || name.includes('controle') || name.includes('gamepad') || cat.toLowerCase() === 'acessorios') {
                    cat = 'Periféricos'; tags.push('periférico', 'gamepad', 'teclado', 'mouse');
                }
                else if (name.includes('gabinete') || name.includes('case') || name.includes('chassis') || cat.toLowerCase() === 'gabinete') { 
                    cat = 'Gabinete'; tags.push('gabinete', 'pc', 'gamer', 'case'); 
                }
                else if (name.includes('placa mãe') || name.includes('motherboard') || name.includes('h610') || name.includes('b650')) { cat = 'Placa Mãe'; tags.push('placa mãe', 'mobo'); }
                else if (cat.toLowerCase() === 'console' || name.includes('playstation') || name.includes('xbox') || name.includes('switch') || name.includes('deck')) { cat = 'Console'; tags.push('console', 'videogame', 'steam deck'); }
                else if (cat.toLowerCase() === 'games') { cat = 'Jogos'; tags.push('jogo', 'game'); }


                return {
                    id: `gh-${item.id}`, nome: item.name, preco: price, categoria: cat, tags: tags,
                    estoque: Math.floor(Math.random() * 10) + 1, descricao: item.desc, imagem: item.image
                };
            }
        }
        
        class TextNormalizer {
            static normalize(text) {
                let normalized = text.toLowerCase();
                for (const [slang, official] of Object.entries(SYNONYMS)) {
                    // Usando regex para garantir que apenas a palavra inteira seja substituída (ou parte dela se for o caso)
                    const regex = new RegExp(`\\b${slang}\\b`, 'gi');
                    normalized = normalized.replace(regex, official);
                }
                return normalized;
            }
        }

        class ThiagoChatbot {
            constructor() {
                this.elements = {
                    widget: document.getElementById('atomicChatWidget'),
                    toggle: document.getElementById('atomicChatToggle'),
                    badge: document.getElementById('atomicChatBadge'),
                    close: document.getElementById('atomicCloseChat'),
                    body: document.getElementById('atomicChatBody'),
                    input: document.getElementById('atomicChatInput'),
                    send: document.getElementById('atomicSendBtn'),
                    loader: document.getElementById('atomicChatLoader'),
                    statusDot: document.getElementById('atomicStatusDot')
                };
                this.isOpen = false;
                this.hasOpened = false;
                this.integrator = new GitHubIntegrator();
                
                this.pendingProductId = null; // Estado para confirmação de carrinho
                
                this.init();
            }

            async init() {
                this.addEventListeners();
                try {
                    let gitData = await this.integrator.fetchCatalog();
                    catalogoGlobal = [...gitData, ...BACKUP_CATALOG.filter(b => !gitData.some(g => g.nome === b.nome))];
                    this.elements.loader.style.display = 'none';
                    this.elements.input.disabled = false;
                    this.elements.send.disabled = false;
                } catch (e) {
                    console.error("Erro init:", e);
                }
            }

            addEventListeners() {
                // CORREÇÃO 1: Clicar na bolha abre/fecha. Clicar no 'X' fecha.
                this.elements.toggle.addEventListener('click', () => this.toggleChat());
                this.elements.close.addEventListener('click', () => this.toggleChat(false)); // Força o fechamento
                this.elements.send.addEventListener('click', () => this.handleUserMessage());
                this.elements.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleUserMessage();
                });
            }

            toggleChat(forceState = null) {
                if (forceState !== null) {
                    this.isOpen = forceState;
                } else {
                    this.isOpen = !this.isOpen;
                }
                
                this.elements.widget.classList.toggle('active', this.isOpen);
                this.elements.badge.style.display = 'none';
                
                if (this.isOpen) {
                    setTimeout(() => this.elements.input.focus(), 300);
                    if (!this.hasOpened) {
                        this.hasOpened = true;
                        setTimeout(() => {
                            this.botReply(`Fala! 👋<br><br>Sou o **Thiago**, especialista em hardware, games, acessórios e produtos de informática aqui da Atomic Games.<br><br>Já tô com o catálogo atualizado e pronto pra te dar aquela força na escolha certa. 😎<br><br>Quer montar ou melhorar seu setup, tá procurando algo específico ou só dando uma olhada?`);
                        }, 400); 
                    }
                }
            }
            
            async handleUserMessage() {
                const rawText = this.elements.input.value.trim();
                if (!rawText) return;
                
                // NOVO: A caixa de input SÓ é limpa aqui, após capturar o texto, para evitar limpar antes do processamento.
                this.elements.input.value = '';
                this.appendMessage(rawText, 'user');
                
                const normalizedText = TextNormalizer.normalize(rawText);

                // ===============================================
                // LÓGICA DE CONFIRMAÇÃO DE CARRINHO (PRIORIDADE MÁXIMA)
                // ===============================================
                if (this.pendingProductId) {
                    const lowerText = rawText.toLowerCase();
                    const isYes = lowerText.includes('sim') || lowerText === 's';
                    const isNo = lowerText.includes('não') || lowerText.includes('nao') || lowerText === 'n';

                    const product = catalogoGlobal.find(p => p.id === this.pendingProductId);
                    
                    if (isYes) {
                        if (product && typeof window.addToCart === 'function') {
                            window.addToCart(this.pendingProductId); 
                            this.botReply(`**Adicionado!** O *${product.nome}* já está no seu carrinho. Posso te ajudar com mais alguma coisa?`);
                        } else if (product) {
                             // Fallback se addToCart não existir no site principal
                             this.botReply(`**Adicionado!** O *${product.nome}* foi adicionado (simulado). Para funcionar de verdade no seu site, certifique-se que o método global *window.addToCart(id)* esteja ativo.`);
                        } else {
                             this.botReply(`Opa, deu um erro! Não consegui encontrar o produto. Tente buscar novamente.`);
                        }
                    } else if (isNo) {
                        this.botReply(`Entendido! O *${product ? product.nome : 'produto'}* não foi adicionado. Quer buscar outro item, ou podemos conversar sobre *Assistência Técnica*?`);
                    } else {
                        // Mensagem não é sim nem não, espera nova resposta
                        this.botReply(`Por favor, responda com *Sim* ou *Não* para confirmar se deseja adicionar ao carrinho.`);
                        return; 
                    }

                    // Reseta o estado após processar Sim ou Não (ou erro)
                    this.pendingProductId = null;
                    return;
                }
                // ===============================================
                
                this.elements.statusDot.classList.add('typing');
                const loadingMsg = this.appendMessage('<i class="fas fa-ellipsis-h"></i>', 'bot', true);
                
                await new Promise(r => setTimeout(r, 600 + Math.random() * 500));
                
                loadingMsg.remove();
                this.elements.statusDot.classList.remove('typing');
                
                const response = this.generateResponse(normalizedText);
                this.botReply(response.text, response.products);
            }

            generateResponse(text) {
                const lower = text.toLowerCase();
                
                // Filtra palavras-chave relevantes, ignorando ruídos
                const keyTerms = lower.split(/[\s?]+/g)
                    .filter(t => t.length > 2 && !NOISE_WORDS.includes(t));

                let budget = null;
                const budgetMatch = lower.match(/(?:r\$\s*)?(\d{1,5})(?:k|\s*mil|\s*reais)?/);
                
                if (budgetMatch) {
                    let rawVal = parseFloat(budgetMatch[1].replace('k', '000'));
                    let hasCurrencySymbol = lower.includes('r$') || lower.includes('reais') || lower.includes('mil') || lower.includes('k');
                    
                    if (hasCurrencySymbol) {
                        budget = (rawVal < 100 && (lower.includes('k') || lower.includes('mil'))) ? rawVal * 1000 : rawVal;
                    } else {
                        const isProductNumber = /\b(play|iphone|galaxy|windows|ryzen|core|pixel|rtx|gtx|rx|ps|xbox)\s*\d+/.test(lower);
                        if (rawVal >= 100 && !isProductNumber) {
                            budget = rawVal;
                        }
                    }
                }

                let found = catalogoGlobal.filter(p => {
                    const pName = p.nome.toLowerCase();
                    const pCat = p.categoria.toLowerCase();
                    
                    // 1. Match pelo termo completo ou tags (Permite encontrar termos como "rtx 4070")
                    const nameMatch = pName.includes(lower) || p.tags.some(tag => lower.includes(tag)) || pCat.includes(lower);
                    
                    const priceMatch = budget ? p.preco <= (budget * 1.2) : true;
                    
                    // 2. Novo SafetyCheck: Garante que P-E-L-O M-E-N-O-S um termo relevante esteja no produto (se houver keyTerms)
                    let safetyCheck = true;
                    if (keyTerms.length > 0) {
                        // Melhoria: Usar `some` com `includes` para cobrir termos parciais
                        safetyCheck = keyTerms.some(term => 
                            pName.includes(term) || 
                            (p.tags && p.tags.some(t => t.includes(term))) ||
                            pCat.includes(term)
                        );
                    } else {
                        if (lower.length < 5) safetyCheck = false; 
                    }
                    
                    // A busca é bem-sucedida se o termo completo der match OU se o safetyCheck com termos filtrados for positivo.
                    return (nameMatch || safetyCheck) && priceMatch;
                });
                
                // Remove duplicados pelo nome, caso venham do catálogo + backup
                const uniqueFound = Array.from(new Set(found.map(p => p.nome)))
                    .map(name => found.find(p => p.nome === name));

                if (lower.match(/^(oi|ola|e ai|fala|salve)/)) return { text: "E aí! Tudo certo? Manda a braba, o que você precisa pro PC hoje?" };
                
                if (uniqueFound.length > 0) {
                    uniqueFound.sort((a, b) => b.preco - a.preco); 
                    return { text: `Achei essas opções aqui que combinam com o que você pediu:`, products: uniqueFound.slice(0, 3) };
                }

                if (budget) {
                    return { text: `Puts, com **R$ ${budget.toLocaleString('pt-BR', {minimumFractionDigits: 2})}** tá difícil achar o que você quer no estoque agora... Tenta aumentar um pouco o budget ou ver outro modelo?` };
                } else if (lower.includes('controle') || lower.includes('gamepad')) {
                    return { text: "Poxa, tô sem esse controle específico em estoque no momento. Mas costumamos receber reposição toda semana! Tenta buscar por 'DualSense' ou 'Xbox Controller' para ver os modelos mais populares." };
                }
                
                // Resposta genérica se a busca falhou mas o usuário tentou buscar por algo
                if (keyTerms.length > 0) {
                    return { text: `Hmm, o sistema não encontrou nada com os termos *"${keyTerms.join(', ')}"* no catálogo. Tenta refinar a busca, ou use um termo mais genérico (tipo 'GPU' ou 'Monitor').` };
                }
                
                return { text: "Não entendi muito bem. Você tá procurando alguma peça específica (tipo GPU, CPU, Controle) ou quer uma ajuda pra montar o PC?" };
            }
            
            appendMessage(text, sender, isTemp = false) {
                const div = document.createElement('div');
                div.className = `atomic-msg ${sender}`;
                div.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                this.elements.body.appendChild(div);
                this.elements.body.scrollTop = this.elements.body.scrollHeight;
                return div;
            }
            
            botReply(text, products = []) {
                this.appendMessage(text, 'bot');
                if (products.length > 0) {
                    products.forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'atomic-product-card';
                        let imgUrl = p.imagem || 'https://via.placeholder.com/300x150?text=Sem+Imagem'; 
                        
                        card.innerHTML = `
                            <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/300x150?text=Sem+Imagem'" alt="${p.nome}">
                            <div class="ap-name">${p.nome}</div>
                            <div class="ap-price">R$ ${p.preco.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                            <div class="ap-desc">${p.descricao}</div>
                        `;
                        
                        // Ação de clique do card para CONFIRMAÇÃO de adição ao carrinho
                        card.onclick = () => {
                            this.pendingProductId = p.id;
                            this.botReply(`Excelente escolha! Quer que eu adicione o **${p.nome}** ao seu carrinho? Responda com *Sim* ou *Não*.`);
                        };
                        
                        this.elements.body.appendChild(card);
                    });
                    this.elements.body.scrollTop = this.elements.body.scrollHeight;
                }
            }
        }
        window.addEventListener('load', () => new ThiagoChatbot());
    </script>
</body>
